name: Production SEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live-site audit
        run: npm run seo:production
